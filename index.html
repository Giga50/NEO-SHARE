<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Share — Обмен Файлами</title>
    <!-- Подключаем стили для правильного отображения виджета -->
    <link rel="stylesheet" href="https://ucarecdn.com">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background: #0b0f19; color: #f3f4f6; display: flex; flex-direction: column; min-height: 100vh; }
        header { text-align: center; margin-bottom: 30px; margin-top: 10px; }
        h1 { font-size: 36px; margin: 0 0 8px 0; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: #00f2fe; text-shadow: 0 0 10px rgba(0, 242, 254, 0.5); }
        .subtitle { font-size: 14px; color: #9ca3af; margin: 0; }
        
        .share-container { max-width: 400px; margin: 20px auto; width: 100%; flex-grow: 1; display: flex; flex-direction: column; gap: 15px; }
        .tile-panel { background: #1e293b; padding: 30px 20px; border: 1px solid #334155; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        /* Стилизация и перекраска кнопки под наш неоновый стиль */
        .uploadcare--widget__button_type_open {
            display: block !important; width: 100% !important; padding: 16px !important; 
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%) !important; 
            color: #0b0f19 !important; border: none !important; border-radius: 8px !important; 
            font-weight: bold !important; font-size: 16px !important; text-transform: uppercase !important; 
            letter-spacing: 1px !important; cursor: pointer !important;
            box-shadow: 0 4px 12px rgba(0, 242, 254, 0.2) !important; transition: 0.2s !important;
        }
        .uploadcare--widget__button_type_open:active { transform: scale(0.98) !important; opacity: 0.9 !important; }
        
        /* Стили для ссылки результата */
        .result-panel { display: none; background: #111827; border: 1px solid #22c55e; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: left; }
        .result-title { font-size: 14px; color: #22c55e; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
        .link-box { display: flex; gap: 8px; }
        .link-url { flex-grow: 1; background: #1f2937; border: 1px solid #374151; padding: 10px; border-radius: 4px; color: #fff; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .copy-btn { background: #374151; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; }
        
        .back-link { display: inline-block; text-align: center; margin: 15px auto; color: #9ca3af; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #00f2fe; }

        footer { text-align: center; margin-top: auto; padding: 20px 0; border-top: 1px solid #1e293b; font-size: 13px; color: #6b7280; }
        footer b { color: #00f2fe; }
    </style>
</head>
<body>

<header>
    <h1>Neo Share</h1>
    <p class="subtitle">Мгновенный обмен файлами прямо из браузера</p>
</header>

<div class="share-container">
    <div class="tile-panel">
        <div style="font-size: 50px; color: #00f2fe; margin-bottom: 20px;">📁</div>
        
        <!-- Сам виджет отправки. Скрипт превратит его в большую удобную кнопку -->
        <input type="hidden" role="uploadcare-uploader" name="my_file" id="uploader" data-public-key="demopublickey" data-tabs="file" />
        
        <!-- Сюда выводится готовая ссылка -->
        <div id="result" class="result-panel">
            <div class="result-title">Файл отправлен! Ссылка:</div>
            <div class="link-box">
                <div id="file-url" class="link-url">https://...</div>
                <button class="copy-btn" onclick="copyLink()">Копия</button>
            </div>
        </div>
    </div>
    
    <a href="https://github.io" class="back-link">← Вернуться в Neo Market</a>
</div>

<footer>
    <div>Создано: <b>Aero Hatsune Miku</b></div>
    <div>Все данные защищены © 2026</div>
</footer>

<!-- Подключаем сам скрипт отправки, который не блокируется телефонами -->
<script src="https://ucarecdn.com"></script>
<script>
    // Находим наш загрузчик на странице
    const widget = uploadcare.Widget('#uploader');
    
    // Когда файл успешно отправился в облако
    widget.onUploadComplete(function(info) {
        if (info && info.cdnUrl) {
            const resultPanel = document.getElementById('result');
            const fileUrlDiv = document.getElementById('file-url');
            
            // Показываем ссылку пользователю
            fileUrlDiv.innerText = info.cdnUrl;
            resultPanel.style.display = 'block';
        }
    });

    // Функция быстрой копии ссылки
    function copyLink() {
        const urlText = document.getElementById('file-url').innerText;
        navigator.clipboard.writeText(urlText).then(() => {
            alert('Ссылка скопирована!');
        });
    }
</script>

</body>
</html>
