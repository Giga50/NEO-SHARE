<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Share — Обмен Файлами</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background: #0b0f19; color: #f3f4f6; display: flex; flex-direction: column; min-height: 100vh; }
        header { text-align: center; margin-bottom: 30px; margin-top: 10px; }
        h1 { font-size: 36px; margin: 0 0 8px 0; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: #00f2fe; text-shadow: 0 0 10px rgba(0, 242, 254, 0.5); }
        .subtitle { font-size: 14px; color: #9ca3af; margin: 0; }
        
        .share-container { max-width: 400px; margin: 20px auto; width: 100%; flex-grow: 1; display: flex; flex-direction: column; gap: 15px; }
        .tile-panel { background: #1e293b; padding: 25px; border: 1px solid #334155; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        .file-label { display: block; background: #26354a; border: 2px dashed #00f2fe; padding: 20px; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-bottom: 15px; }
        .file-label:active { transform: scale(0.98); background: #1e293b; }
        .file-label span { display: block; margin-top: 10px; font-size: 14px; color: #9ca3af; word-break: break-all; }
        #file-input { display: none; }
        
        .btn { display: block; width: 100%; padding: 14px; background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); color: #0b0f19; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; box-shadow: 0 4px 12px rgba(0, 242, 254, 0.2); }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        .btn:disabled { background: #334155; color: #6b7280; box-shadow: none; cursor: not-allowed; }
        
        .result-panel { display: none; background: #111827; border: 1px solid #22c55e; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: left; }
        .result-title { font-size: 14px; color: #22c55e; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
        .link-box { display: flex; gap: 8px; }
        .link-url { flex-grow: 1; background: #1f2937; border: 1px solid #374151; padding: 8px; border-radius: 4px; color: #fff; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .copy-btn { background: #374151; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; }
        .copy-btn:active { background: #4b5563; }
        
        .status-text { font-size: 14px; color: #00f2fe; margin-top: 10px; display: none; font-weight: 600; }
        .back-link { display: inline-block; text-align: center; margin: 15px auto; color: #9ca3af; text-decoration: none; font-size: 14px; transition: color 0.2s; }
        .back-link:hover { color: #00f2fe; }

        footer { text-align: center; margin-top: auto; padding: 20px 0; border-top: 1px solid #1e293b; font-size: 13px; color: #6b7280; }
        footer b { color: #00f2fe; }
    </style>
</head>
<body>

<header>
    <h1>Neo Share</h1>
    <p class="subtitle">Мгновенный обмен файлами</p>
</header>

<div class="share-container">
    <div class="tile-panel">
        <label for="file-input" class="file-label">
            <div style="font-size: 40px; color: #00f2fe;">📁</div>
            <span id="file-name">Нажмите, чтобы выбрать файл</span>
        </label>
        <input type="file" id="file-input" onchange="fileSelected()">
        
        <button id="upload-btn" class="btn" onclick="uploadFile()" disabled>Загрузить в сеть</button>
        <div id="status" class="status-text">Загрузка файла... Подождите...</div>
        
        <div id="result" class="result-panel">
            <div class="result-title">Готово! Ссылка на скачивание:</div>
            <div class="link-box">
                <div id="file-url" class="link-url">https://...</div>
                <button class="copy-btn" onclick="copyLink()">Копия</button>
            </div>
        </div>
    </div>
    
    <a href="https://github.io" class="back-link">← Вернуться в Neo Market</a>
</div>

<footer>
    <div>Создано: <b>Aero Hatsune Miku</b></div>
    <div>Все данные защищены © 2026</div>
</footer>

<script>
    let fileToUpload = null;

    function fileSelected() {
        const input = document.getElementById('file-input');
        const labelText = document.getElementById('file-name');
        const btn = document.getElementById('upload-btn');
        
        if (input.files && input.files[0]) {
            fileToUpload = input.files[0];
            const sizeInMB = (fileToUpload.size / 1024 / 1024).toFixed(2);
            labelText.innerText = fileToUpload.name + " (" + sizeInMB + " MB)";
            btn.disabled = false;
            document.getElementById('result').style.display = 'none';
        }
    }

    async function uploadFile() {
        if (!fileToUpload) return;
        
        const btn = document.getElementById('upload-btn');
        const status = document.getElementById('status');
        const resultPanel = document.getElementById('result');
        const fileUrlDiv = document.getElementById('file-url');
        
        btn.disabled = true;
        status.style.display = 'block';
        
        const formData = new FormData();
        formData.append('reqtype', 'fileupload');
        formData.append('fileToUpload', fileToUpload);
        
        try {
            const response = await fetch('https://catbox.moe', {
                method: 'POST',
                body: formData
            });
            
            if (response.ok) {
                const link = await response.text();
                if (link && link.startsWith('http')) {
                    fileUrlDiv.innerText = link.trim();
                    resultPanel.style.display = 'block';
                    status.style.display = 'none';
                } else {
                    throw new Error('Некорректный ответ сервера');
                }
            } else {
                throw new Error('Сбой загрузки');
            }
        } catch (error) {
            alert('Ошибка при отправке файла. Попробуйте ещё раз.');
            btn.disabled = false;
            status.style.display = 'none';
        }
    }

    function copyLink() {
        const urlText = document.getElementById('file-url').innerText;
        navigator.clipboard.writeText(urlText).then(() => {
            alert('Ссылка скопирована!');
        });
    }
</script>

</body>
</html>
