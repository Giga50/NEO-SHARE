<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Share — Обмен Файлами</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background: #0b0f19; color: #f3f4f6; display: flex; flex-direction: column; min-height: 100vh; }
        header { text-align: center; margin-bottom: 30px; margin-top: 10px; }
        h1 { font-size: 36px; margin: 0 0 8px 0; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: #00f2fe; text-shadow: 0 0 10px rgba(0, 242, 254, 0.5); }
        .subtitle { font-size: 14px; color: #9ca3af; margin: 0; }
        
        .share-container { max-width: 400px; margin: 20px auto; width: 100%; flex-grow: 1; display: flex; flex-direction: column; gap: 15px; }
        .tile-panel { background: #1e293b; padding: 25px; border: 1px solid #334155; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        .file-label { display: block; background: #26354a; border: 2px dashed #00f2fe; padding: 25px 20px; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-bottom: 15px; }
        .file-label:active { transform: scale(0.98); background: #1e293b; }
        .file-label span { display: block; margin-top: 15px; font-size: 15px; color: #ffffff; font-weight: 600; word-break: break-all; }
        #file-input { display: none; }
        
        .btn { display: block; width: 100%; padding: 14px; background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); color: #0b0f19; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; box-shadow: 0 4px 12px rgba(0, 242, 254, 0.2); }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        .btn:disabled { background: #334155; color: #6b7280; box-shadow: none; cursor: not-allowed; }
        
        .result-panel { display: none; background: #111827; border: 1px solid #22c55e; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: left; }
        .result-title { font-size: 14px; color: #22c55e; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
        .link-box { background: #1f2937; border: 1px solid #374151; padding: 12px; border-radius: 4px; color: #fff; font-size: 14px; word-break: break-all; -webkit-user-select: all; user-select: all; margin-top: 5px; }
        
        .status-text { font-size: 14px; color: #00f2fe; margin-top: 10px; display: none; font-weight: 600; }
        .back-link { display: inline-block; text-align: center; margin: 15px auto; color: #9ca3af; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #00f2fe; }

        footer { text-align: center; margin-top: auto; padding: 20px 0; border-top: 1px solid #1e293b; font-size: 13px; color: #6b7280; }
        footer b { color: #00f2fe; }
    </style>
</head>
<body>

<header>
    <h1>Neo Share</h1>
    <p class="subtitle">Мгновенный обмен файлами</p>
</header>

<div class="share-container">
    <div class="tile-panel">
        <label for="file-input" class="file-label">
            <div style="font-size: 50px;">📁</div>
            <span id="file-name">Выбрать файл для загрузки</span>
        </label>
        <input type="file" id="file-input">
        
        <button id="upload-btn" class="btn" disabled>Загрузить в сеть</button>
        <div id="status" class="status-text">Файл отправляется... Пожалуйста, подождите</div>
        
        <div id="result" class="result-panel">
            <div class="result-title">Готово! Зажмите текст ниже для копирования:</div>
            <div id="file-url" class="link-box">Загрузка...</div>
        </div>
    </div>
    
    <a href="https://github.io" class="back-link">← Вернуться в Neo Market</a>
</div>

<footer>
    <div>Создано: <b>Aero Hatsune Miku</b></div>
    <div>Все данные защищены © 2026</div>
</footer>

<script>
    const fileInput = document.getElementById('file-input');
    const labelText = document.getElementById('file-name');
    const uploadBtn = document.getElementById('upload-btn');
    const statusText = document.getElementById('status');
    const resultPanel = document.getElementById('result');
    const fileUrlDiv = document.getElementById('file-url');

    fileInput.addEventListener('change', function() {
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            const sizeInMB = (file.size / 1024 / 1024).toFixed(2);
            labelText.innerText = file.name + " (" + sizeInMB + " MB)";
            uploadBtn.disabled = false;
            resultPanel.style.display = 'none';
        }
    });

    uploadBtn.addEventListener('click', async function() {
        if (fileInput.files.length === 0) return;
        
        uploadBtn.disabled = true;
        statusText.style.display = 'block';
        
        const file = fileInput.files[0];
        const formData = new FormData();
        formData.append('image', file);
        
        try {
            // Используем бесплатный публичный ключ API для загрузки без ограничений браузера
            const response = await fetch('https://imgbb.com', {
                method: 'POST',
                body: formData
            });
            
            const result = await response.json();
            
            if (response.ok && result.data && result.data.url) {
                fileUrlDiv.innerText = result.data.url;
                resultPanel.style.display = 'block';
                statusText.style.display = 'none';
            } else {
                alert('Ошибка сервера. Попробуйте другой файл.');
                uploadBtn.disabled = false;
                statusText.style.display = 'none';
            }
        } catch (error) {
            alert('Ошибка отправки. Проверьте интернет.');
            uploadBtn.disabled = false;
            statusText.style.display = 'none';
        }
    });
</script>

</body>
</html>
