<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Share — Обмен Файлами</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background: #0b0f19; color: #f3f4f6; display: flex; flex-direction: column; min-height: 100vh; }
        header { text-align: center; margin-bottom: 30px; margin-top: 10px; }
        h1 { font-size: 36px; margin: 0 0 8px 0; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: #00f2fe; text-shadow: 0 0 10px rgba(0, 242, 254, 0.5); }
        .subtitle { font-size: 14px; color: #9ca3af; margin: 0; }
        
        .share-container { max-width: 400px; margin: 20px auto; width: 100%; flex-grow: 1; display: flex; flex-direction: column; gap: 15px; }
        
        /* Панель-форма */
        .tile-form { background: #1e293b; padding: 25px; border: 1px solid #334155; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        /* Поле выбора файла */
        .file-input-styled { display: block; width: 100%; background: #26354a; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; outline: none; }
        
        /* Кнопка отправки */
        .btn { display: block; width: 100%; padding: 15px; background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); color: #0b0f19; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; box-shadow: 0 4px 12px rgba(0, 242, 254, 0.2); }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        
        .info-box { font-size: 13px; color: #9ca3af; margin-bottom: 20px; line-height: 1.5; text-align: left; background: #111827; padding: 12px; border-radius: 6px; border-left: 3px solid #00f2fe; }
        .back-link { display: inline-block; text-align: center; margin: 15px auto; color: #9ca3af; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #00f2fe; }

        footer { text-align: center; margin-top: auto; padding: 20px 0; border-top: 1px solid #1e293b; font-size: 13px; color: #6b7280; }
        footer b { color: #00f2fe; }
    </style>
</head>
<body>

<header>
    <h1>Neo Share</h1>
    <p class="subtitle">Мгновенный обмен файлами</p>
</header>

<div class="share-container">
    <!-- Настоящая HTML форма, отправляющая файл напрямую на сервер без JS -->
    <form class="tile-form" action="https://tmpfiles.org" method="POST" enctype="multipart/form-data">
        
        <div style="font-size: 50px; margin-bottom: 15px;">📁</div>
        
        <div class="info-box">
            Выберите любой файл на телефоне и нажмите кнопку ниже. Сервер примет файл и сразу покажет ссылку на экране.
        </div>
        
        <!-- Поле выбора -->
        <input type="file" name="file" class="file-input-styled" required>
        
        <!-- Кнопка отправки формы -->
        <button type="submit" class="btn">Загрузить в сеть</button>
        
    </form>
    
    <a href="https://github.io" class="back-link">← Вернуться в Neo Market</a>
</div>

<footer>
    <div>Создано: <b>Aero Hatsune Miku</b></div>
    <div>Все данные защищены © 2026</div>
</footer>

</body>
</html>
